<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Country Explorer</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    input { padding: .5rem; width: 65%; }
    button { padding: .5rem 1rem; }
    .valid { color: green; }
    .invalid { color: crimson; }
    #card img { max-width: 160px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Country Explorer</h1>

  <form id="search-form" novalidate>
    <input id="country" type="text" required minlength="3" placeholder="e.g. Colombia">
    <button type="submit">Search</button>
    <p id="hint" class="invalid">Type at least 3 letters</p>
  </form>

  <div id="card"></div>

  <script>
    // REST Countries v5 (the old v3.1 API was shut down and now needs a free API key)
    const API = "https://api.restcountries.com/countries/v5/names.common";
    const API_KEY = "rc_live_30f0cdb3969649e5abad34db445502a1";

    const form = document.querySelector("#search-form");
    const input = document.querySelector("#country");
    const hint = document.querySelector("#hint");
    const card = document.querySelector("#card");

    // Real-time validation: runs every time the user types
    input.addEventListener("input", () => {
      const isValid = input.value.trim().length >= 3;
      hint.textContent = isValid ? "Looks good" : "Type at least 3 letters";
      hint.className = isValid ? "valid" : "invalid";
    });

    // Ask the API for a country and show it in the page
    async function showCountry(name) {
      card.textContent = "Loading…";
      try {
        const url = `${API}?q=${encodeURIComponent(name)}&limit=10&api-key=${API_KEY}`;
        const response = await fetch(url);

        // fetch() does not reject on 404, so we check the status ourselves
        if (response.status === 404) {
          card.textContent = "Country not found";
          return;
        }
        if (!response.ok) {
          throw new Error("Status " + response.status);
        }

        const json = await response.json();
        const list = json.data.objects;
        if (!list || list.length === 0) {
          card.textContent = "Country not found";
          return;
        }

        // Prefer the exact name match, otherwise use the first result
        const country =
          list.find((c) => c.names.common.toLowerCase() === name.toLowerCase()) || list[0];
        const capital = country.capitals && country.capitals[0] ? country.capitals[0].name : "N/A";
        const population = country.population ? country.population.toLocaleString() : "N/A";
        const flag =
          (country.flag && country.flag.url_png) ||
          `https://flags.restcountries.com/v5/w320/${country.codes.alpha_2.toLowerCase()}.png`;

        // Render the data in the DOM
        card.innerHTML = `
          <h2>${country.names.common}</h2>
          <p><strong>Capital:</strong> ${capital}</p>
          <p><strong>Population:</strong> ${population}</p>
          <img src="${flag}" alt="Flag of ${country.names.common}">
        `;
      } catch (error) {
        // Network failure or unexpected error
        card.textContent = "Could not load the data. Please try again.";
      }
    }

    // On submit: stop the page reload and search if the text is valid
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = input.value.trim();
      if (name.length >= 3) {
        showCountry(name);
      }
    });
  </script>
</body>
</html>
