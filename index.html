<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Country Explorer</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    input { padding: .5rem; width: 65%; }
    button { padding: .5rem 1rem; }
    .valid { color: green; }
    .invalid { color: crimson; }
    #card img { max-width: 160px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Country Explorer</h1>

  <form id="search-form" novalidate>
    <input id="country" type="text" required minlength="3" placeholder="e.g. Colombia">
    <button type="submit">Search</button>
    <p id="hint" class="invalid">Type at least 3 letters</p>
  </form>

  <div id="card"></div>

  <script>
    // API endpoint to search countries by name
    const API = "https://restcountries.com/v3.1/name/";

    const form = document.querySelector("#search-form");
    const input = document.querySelector("#country");
    const hint = document.querySelector("#hint");
    const card = document.querySelector("#card");

    // Real-time validation: runs every time the user types
    input.addEventListener("input", () => {
      const isValid = input.value.trim().length >= 3;
      hint.textContent = isValid ? "Looks good" : "Type at least 3 letters";
      hint.className = isValid ? "valid" : "invalid";
    });

    // Ask the API for a country and show it in the page
    async function showCountry(name) {
      card.textContent = "Loading…";
      try {
        const response = await fetch(API + encodeURIComponent(name));

        // fetch() does not reject on 404, so we check the status ourselves
        if (response.status === 404) {
          card.textContent = "Country not found";
          return;
        }
        if (!response.ok) {
          throw new Error("Status " + response.status);
        }

        const data = await response.json();
        const country = data[0];

        // Render the data in the DOM
        card.innerHTML = `
          <h2>${country.name.common}</h2>
          <p><strong>Capital:</strong> ${country.capital ? country.capital[0] : "N/A"}</p>
          <p><strong>Population:</strong> ${country.population.toLocaleString()}</p>
          <img src="${country.flags.png}" alt="Flag of ${country.name.common}">
        `;
      } catch (error) {
        // Network failure or unexpected error
        card.textContent = "Could not load the data. Please try again.";
      }
    }

    // On submit: stop the page reload and search if the text is valid
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = input.value.trim();
      if (name.length >= 3) {
        showCountry(name);
      }
    });
  </script>
</body>
</html>
